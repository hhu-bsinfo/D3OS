[package]
edition = "2024"
name = "kernel"
version = "0.1.0"
authors = ["Michael Schöttner <michael.schoettner@hhu.de>, Fabian Ruhland <ruhland@hhu.de>"]
build = "build.rs"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[features]
virtio_tests = []
default = ["frame_alloc_lockfree"]
frame_alloc_lockfree = []
frame_alloc_locking = []

[dependencies]
# Local dependencies
graphic = { path = "../library/graphic" }
stream = { path = "../library/stream" }
syscall = { path = "../library/syscall", default-features = false }
naming = { path = "../library/naming", default-features = false }
terminal = { path = "../library/terminal", default-features = false }
drawer = { path = "../library/drawer", default-features = false }
system_info = { path = "../library/system_info", default-features = false }
input = { path = "../library/input", default-features = false }
virtio = { package = "virtio-drivers", git = "https://github.com/hhu-bsinfo/virtio-drivers.git", rev = "f127bb0e9f3d71142ed1354e88c76b419261f8f3" }

# External depencies
spin = "0.12"
x86_64 = "0.15.2"
linked_list_allocator = { version = "0.10.6", features = ["alloc_ref"] }
ps2 = { git = "https://github.com/lnx00/ps2-rs.git" }
pc-keyboard = "0.9"
chrono = { version = "0.4.40", default-features = false, features = ["alloc"] }
nolock = { version = "0.4.1", default-features = false, features = ["queues"] }
thingbuf = { version = "0.1", default-features = false, features = ["alloc"] }
acpi = "5.2.0"
x2apic = "0.5.0"
raw-cpuid = "11.2.0"
smallmap = "1.4.2"
log = "0.4.26"
goblin = { version = "0.10", default-features = false, features = ["elf32", "elf64", "endian_fd"]}
tar-no-std = "0.5"
pci_types = "0.10.0"
bitflags = "2.9.0"
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "log", "proto-ipv6", "socket-dhcpv4", "proto-ipv6-slaac", "socket-udp", "socket-tcp", "socket-icmp", "socket-dns", "dns-max-result-count-4", "dns-max-server-count-4"] }
mbrs = { version = "0.3.1", default-features = false, features = ["no-std"] }
bitfield-struct = "0.1"
num_enum = { version = "0.7.3", default-features = false }
llfree = { git = "https://github.com/luhsra/llfree-rs", default-features = false }
uuid = { version = "1.23.1", default-features = false, features = ["v7"] }

# these three need to be updated in sync
multiboot2 = "0.25"
uefi-raw = "0.15"
uefi = { version = "0.39", features = ["alloc"] }

[build-dependencies]
built = { version = "0.7.7", features = ["chrono", "git2"] }
