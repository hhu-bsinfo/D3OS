[package]
edition = "2024"
name = "input"
version = "0.1.0"
authors = ["Leon Lehnen", "Sebastian Keller <sebastian.keller@hhu.de>"]

[lib]
test = false
doctest = false
bench = false

[features]
default = ["userspace"]
userspace = ["dep:syscall", "dep:ime", "dep:bitflags"]

[dependencies]
# Local dependencies
syscall = { path = "../syscall", optional = true }
ime = { path = "../ime", optional = true }

# External dependencies
bitflags = { version = "2.9.0", optional = true }
