[package]
edition = "2024"
name = "ibverbs"
version = "0.1.0"
authors = [ "Sandro Jose Leal Miudo" ]

[lib]
path = "src/ibverbs.rs"

[dependencies]
# internal depencies
rdma = { path = "../../library/rdma" }
mm = { path = "../../library/mm" }
syscall = { path = "../../library/syscall" }

# external depencies
bincode = { version = "2.0.1", optional = true, default-features = false, features = ["derive", "alloc"] }
serde = { version = "1.0.219", optional = true, default-features = false, features = ["derive", "alloc"] }
core3 = { version = "0.1", default-features = false }

[features]
default = ["serialize"]
serialize = ["dep:bincode"]
serde = ["dep:serde"]
