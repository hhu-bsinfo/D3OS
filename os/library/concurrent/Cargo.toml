[package]
edition = "2024"
name = "concurrent"
version = "0.1.0"
authors = ["Michael Schöttner <michael.schoettner@hhu.de>, Fabian Ruhland <ruhland@hhu.de>"]

[lib]
test = false
doctest = false
bench = false

[dependencies]
# Local dependencies
syscall = { path = "../syscall" }
time = { path = "../time" }

# External dependencies
chrono = { version = "0.4.42", default-features = false, features = ["alloc"] }
spin = "0.12"
uuid = { version = "1.23.1", default-features = false, features = ["v7"] }
