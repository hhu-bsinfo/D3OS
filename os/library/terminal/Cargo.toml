[package]
edition = "2024"
name = "terminal"
version = "0.1.0"
authors = ["Michael Schöttner <michael.schoettner@hhu.de>, Fabian Ruhland <ruhland@hhu.de>"]

[lib]
test = false
doctest = false
bench = false

[features]
default = ["userspace"]
userspace = ["dep:bootstrap_env", "dep:syscall", "dep:stream", "dep:spin", "dep:pc-keyboard", "dep:spin", "dep:log", "dep:logger", "dep:naming"]

[dependencies]
# Local dependencies
bootstrap_env = { path = "../bootstrap_env", optional = true }
syscall = { path = "../syscall", optional = true }
stream = { path = "../stream", optional = true }
logger = { path = "../logger", optional = true }
naming = { path = "../naming", optional = true }

# External dependencies
spin = { version = "0.12", optional = true }
num_enum = { version = "0.7", default-features = false }
pc-keyboard = { version = "0.9", default-features = false, optional = true }
log = { version = "0.4.26", optional = true }
