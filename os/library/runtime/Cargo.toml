[package]
edition = "2024"
name = "runtime"
version = "0.1.0"
authors = ["Michael Schöttner <michael.schoettner@hhu.de>, Fabian Ruhland <ruhland@hhu.de>"]

[lib]
test = false
doctest = false
bench = false

[dependencies]
# Local dependencies
#terminal = { path = "../terminal" }
syscall = { path = "../syscall" }
concurrent = { path = "../concurrent" }
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
compiler_builtins = { version = "0.1", optional = true, features = ["mem"]}
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }

# External dependencies
linked_list_allocator = { version = "0.10.5", features = ["alloc_ref"], optional = true }

#d3os
cfg-if = "1.0"

[features]
rustc-dep-of-std = [
	"core",
    "alloc",
	"compiler_builtins",
    #"terminal/rustc-dep-of-std",
    "syscall/rustc-dep-of-std",
    "concurrent/rustc-dep-of-std",
    #"stream/rustc-dep-of-std",
	"cfg-if/rustc-dep-of-std",
]
no-std = [
	"linked_list_allocator",
]